blueprint:
  name: 智生活通知
  description: >-
    包裹、寄放物、社區公告的通知。每一筆異動觸發一次（同時到兩件會通知兩次），
    可分別勾選要通知的項目，再填入自己的通知動作。
    也可在整合異常（API 連線失敗或整合無法載入）持續一段時間後通知。


    通知動作中可使用的變數：

    - `{{ message }}`：訊息（可在「訊息內容」區塊自訂）

    - `{{ image }}`：本機 JPEG 照片檔案路徑（未附照片或取得失敗時為空字串）

    - `{{ image_url }}`：照片的外部連結（給需要網址的通知服務）

    - `{{ image_relative_url }}`：照片的相對連結（給 Companion App）

    - `{{ link }}`：公告連結，點開才會把公告標為已讀（非公告時為空字串）

    - `{{ kind }}`：事件種類，例如 `package_arrived`、`integration_error`

    - `{{ data }}`：事件原始資料，例如 `{{ data.p_name }}`、`{{ data.c_dtype }}`


    照片會先存成本機檔案再交給通知動作，不需要讓通知服務從外部連回 HA。
    照片取得失敗時仍會發送不含照片的通知。
  domain: automation
  author: xangin
  source_url: https://github.com/xangin/Smartdaily_Postal_HA/blob/main/blueprints/automation/smartdaily_postal_ha/smartdaily_notify.yaml
  homeassistant:
    min_version: "2025.4.0"
  input:
    events:
      name: 通知項目
      default:
        - package_arrived
        - package_picked_up
        - collection_deposited
        - collection_collected
        - announcement_new
        - integration_error
      selector:
        select:
          multiple: true
          mode: list
          options:
            - label: 新包裹
              value: package_arrived
            - label: 包裹已領取
              value: package_picked_up
            - label: 新寄放物
              value: collection_deposited
            - label: 寄放物已領取
              value: collection_collected
            - label: 新公告
              value: announcement_new
            - label: 整合異常
              value: integration_error
    collection_scope:
      name: 寄放物通知範圍
      default: all
      selector:
        select:
          mode: list
          options:
            - label: 全部（含寄放給其他住戶、我們寄放給別人的）
              value: all
            - label: 只有寄放給我們的
              value: mine
    image_events:
      name: 附上照片的項目
      default:
        - package_arrived
        - collection_deposited
      selector:
        select:
          multiple: true
          mode: list
          options:
            - label: 新包裹
              value: package_arrived
            - label: 包裹已領取
              value: package_picked_up
            - label: 新寄放物
              value: collection_deposited
            - label: 寄放物已領取
              value: collection_collected
    image_mine_only:
      name: 寄放物照片只在寄放給我們時附上
      default: true
      selector:
        boolean: {}
    image_dir:
      name: 照片存放資料夾
      description: >-
        留空則存到媒體資料夾下的 smartdaily_postal_ha（HAOS 為 /media/smartdaily_postal_ha）。
        須在允許寫入的資料夾內；超過 7 天的照片會自動刪除。
      default: ""
      selector:
        text: {}
    error_delay:
      name: 整合異常持續多久才通知
      description: >-
        短暫斷線不通知。HA 啟動時整合就無法載入的情況，也會在這段時間後通知。
      default:
        minutes: 10
      selector:
        duration: {}
    notify_action:
      name: 通知動作
      description: >-
        例如呼叫 script.send_notify，訊息填 {{ message }}、圖片填 {{ image }}。
      selector:
        action: {}
    messages:
      name: 訊息內容
      icon: mdi:message-text-outline
      collapsed: true
      input:
        package_arrived_message:
          name: 新包裹
          default: "{{ data.p_name }}的{{ data.postal_typeText }}來囉！{{ '（冷藏）' if data.refrigerated else '' }}"
          selector:
            text:
              multiline: true
        package_picked_up_message:
          name: 包裹已領取
          default: "{{ data.p_name }}的{{ data.postal_typeText }}已領取"
          selector:
            text:
              multiline: true
        collection_deposited_message:
          name: 新寄放物
          description: "{{ recipient }} 為收件人；收件人是「全戶通知」時會改用戶號。"
          default: "{% if data.is_mine %}有新的寄放{{ data.c_dtype }}，記得領唷!!{% else %}寄放給{{ recipient }}的{{ data.c_dtype }}已登記{% endif %}"
          selector:
            text:
              multiline: true
        collection_collected_message:
          name: 寄放物已領取
          default: "{% if data.is_mine %}我們的寄放{{ data.c_dtype }}已取件{% else %}{{ recipient }}已領取寄放的{{ data.c_dtype }}{% endif %}"
          selector:
            text:
              multiline: true
        announcement_new_message:
          name: 新公告
          default: "社區新公告【{{ data.TypeName }}】{{ data.Title }}"
          selector:
            text:
              multiline: true
        integration_error_message:
          name: 整合異常
          description: "{{ error_detail }} 為錯誤原因。"
          default: "⚠️ 智生活整合異常：{{ error_detail }}"
          selector:
            text:
              multiline: true

# 整合異常的啟動檢查需要等待；用 parallel 才不會卡住其他通知
mode: parallel
max: 20

triggers:
  - trigger: event
    id: smartdaily_event
    event_type: smartdaily_postal_ha_package
  - trigger: event
    id: smartdaily_event
    event_type: smartdaily_postal_ha_collection
  - trigger: event
    id: smartdaily_event
    event_type: smartdaily_postal_ha_announcement
  # 「API 連線異常」為 on，或整合無法載入（unavailable）持續一段時間
  - trigger: template
    id: integration_error
    value_template: &error_check >-
      {{ integration_entities('smartdaily_postal_ha')
         | select('match', 'binary_sensor\.')
         | select('is_state', ['on', 'unavailable'])
         | list | count > 0 }}
    for: !input error_delay
  # 啟動時就已異常不會觸發上面的模板，另外檢查
  - trigger: homeassistant
    id: startup_check
    event: start

variables:
  selected_events: !input events
  collection_scope: !input collection_scope
  image_events: !input image_events
  image_mine_only: !input image_mine_only
  is_error: "{{ trigger.id in ['integration_error', 'startup_check'] }}"
  data: "{{ {} if is_error else trigger.event.data }}"
  category: >-
    {{ 'integration' if is_error else trigger.event.event_type | replace('smartdaily_postal_ha_', '') }}
  kind: "{{ 'integration_error' if is_error else category ~ '_' ~ data.type }}"
  recipient: >-
    {{ data.get('to_tablet', '') if data.get('to_name') == '全戶通知' else data.get('to_name', '') }}
  link: "{{ data.get('link', '') }}"
  want_image: >-
    {{ kind in image_events and data.get('image_key', '') != ''
       and (category != 'collection' or not image_mine_only or data.get('is_mine', false)) }}
  image_dir: !input image_dir

conditions:
  - condition: template
    value_template: "{{ kind in selected_events }}"
  - condition: template
    value_template: "{{ category != 'collection' or collection_scope == 'all' or data.get('is_mine') }}"

actions:
  # 把這一筆的照片存成本機 JPEG（照片剛登記時會等待重試），失敗則不附照片
  - variables:
      saved: {}
  - if: "{{ want_image }}"
    then:
      - action: smartdaily_postal_ha.save_image
        continue_on_error: true
        response_variable: saved
        data:
          entry_id: "{{ data.entry_id }}"
          category: "{{ category }}"
          key: "{{ data.image_key }}"
          directory: "{{ image_dir }}"
  - variables:
      image: "{{ saved.get('path', '') if saved is mapping else '' }}"
      image_url: "{{ data.get('image_url', '') if want_image else '' }}"
      image_relative_url: "{{ data.get('image_path', '') if want_image else '' }}"
  - choose:
      - conditions: "{{ kind == 'package_arrived' }}"
        sequence:
          - variables:
              message: !input package_arrived_message
          - sequence: !input notify_action
      - conditions: "{{ kind == 'package_picked_up' }}"
        sequence:
          - variables:
              message: !input package_picked_up_message
          - sequence: !input notify_action
      - conditions: "{{ kind == 'collection_deposited' }}"
        sequence:
          - variables:
              message: !input collection_deposited_message
          - sequence: !input notify_action
      - conditions: "{{ kind == 'collection_collected' }}"
        sequence:
          - variables:
              message: !input collection_collected_message
          - sequence: !input notify_action
      - conditions: "{{ kind == 'announcement_new' }}"
        sequence:
          - variables:
              message: !input announcement_new_message
          - sequence: !input notify_action
      - conditions: "{{ kind == 'integration_error' }}"
        sequence:
          - if: "{{ trigger.id == 'startup_check' }}"
            then:
              - condition: template
                value_template: *error_check
              - delay: !input error_delay
              - condition: template
                value_template: *error_check
          - variables:
              error_detail: >-
                {%- set ns = namespace(msgs=[]) -%}
                {%- for e in integration_entities('smartdaily_postal_ha') | select('match', 'binary_sensor\.') -%}
                  {%- if is_state(e, 'unavailable') -%}
                    {%- set ns.msgs = ns.msgs + ['整合無法載入'] -%}
                  {%- elif is_state(e, 'on') -%}
                    {%- for k, v in states[e].attributes.items() if k.startswith('Smartdaily') and v != 'OK' -%}
                      {%- set ns.msgs = ns.msgs + [(v | string)[:150]] -%}
                    {%- endfor -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.msgs | unique | join('；') if ns.msgs else '無法取得資料' }}
              message: !input integration_error_message
          - sequence: !input notify_action
